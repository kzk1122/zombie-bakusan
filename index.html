<script>
// Problem notes. Plain script, so it runs even when the 3D module never loads: zbDiag(key, text) sets one line, null clears it.
(function () {
  var lines = {};
  window.zbDiag = function (key, text) {
    if (text == null) delete lines[key]; else lines[key] = String(text);
    var el = document.getElementById('diag'), out = [];
    for (var k in lines) out.push(lines[k]);
    el.textContent = out.join('\n');
    el.hidden = !out.length;
  };
  window.addEventListener('error', function (e) { zbDiag('err', 'エラー: ' + (e.message || e) + (e.lineno ? ' (' + e.lineno + '行目)' : '')); });
  window.addEventListener('unhandledrejection', function (e) { var r = e.reason; zbDiag('err', 'エラー: ' + (r && r.message || r)); });
  // the 3D engine comes from a CDN; if it never arrives, say so instead of waiting forever
  setTimeout(function () {
    if (!document.getElementById('startBtn').disabled) return;
    document.getElementById('startSub').textContent = '3Dを読み込めませんでした';
    zbDiag('load', '3Dの部品を読み込めませんでした。通信状態を確かめて再読み込みしてください。');
  }, 20000);
})();
</script>

function updateLights(dt) {
  let load = 0;
  for (const l of blastLights) {
    const u = l.userData; u.t += dt;
    const k = Math.max(0, 1 - u.t / u.life);

const BPM = 150, STEP = 60 / BPM / 4;

  const g = actx.createGain(); g.gain.setValueAtTime(0.32, t); g.gain.exponentialRampToValueAtTime(0.0001, t + STEP * 1.9);
  o.connect(lp).connect(g).connect(musicBus); o.start(t); o.stop(t + STEP * 2);

  const s = i % 16, fev = feverT > 0, bossOn = boss && boss.state === 'walk';
  const note = BASS[(i >> 1) % 16];
  if (s % 4 === 0 || (fev && s === 14) || (bossOn && s === 10)) mKick(t);
  if (s === 4 || s === 12 || (fev && s === 15)) mSnare(t);
  if (fev || s % 2 === 0) mHat(t, s % 4 === 2);

}

  // Fewer at the wire and set back a little from it: the dust of a blast right there would fog the whole screen

  }
