<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ゾンビ爆散</title>
<meta name="description" content="迫り来るゾンビの大群をマシンガンとロケランで吹き飛ばす、15秒1本勝負のブラウザゲーム。">
<meta name="theme-color" content="#1d1426">
<meta property="og:type" content="website">
<meta property="og:title" content="ゾンビ爆散">
<meta property="og:description" content="迫り来るゾンビの大群をマシンガンとロケランで吹き飛ばす、15秒1本勝負のブラウザゲーム。">
<meta property="og:url" content="https://kzk1122.github.io/zombie-bakusan/">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: one full-screen canvas looking down a city avenue at the horde, gun at the bottom; HUD strip on top, overlays centered. Single dusk-night look by design. */
:root {
  --night: #1d1426;
  --dusk: #4a2340;
  --ember: #ff7a2f;
  --flare: #ffd25e;
  --rot: #9aae5c;
  --bone: #f3e9dc;
  --ink: #120c17;
  --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--night);
  color: var(--bone);
  font-family: var(--body);
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
#stage { position: relative; width: 100%; height: 100%; }
canvas { display: block; width: 100%; height: 100%; cursor: none; }

.hud {
  position: absolute; inset: 0 0 auto 0;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px;
  padding-top: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
  font-variant-numeric: tabular-nums;
}
.stat { display: flex; flex-direction: column; line-height: 1.1; }
.stat .k { font-size: 11px; letter-spacing: .12em; opacity: .7; }
.stat .v { font-family: var(--display); font-size: 22px; }
.stat .v.warn { color: var(--ember); }
.stat.time .v { font-size: 30px; }
.ammo { display: flex; gap: 4px; padding-top: 4px; }
.ammo i { width: 9px; height: 20px; border-radius: 5px 5px 2px 2px; background: var(--ink); border: 2px solid var(--bone); opacity: .3; }
.ammo i.on { background: var(--ember); border-color: var(--flare); opacity: 1; }
.gauge { display: block; width: 110px; height: 12px; margin-top: 6px; border: 2px solid var(--bone); border-radius: 4px; overflow: hidden; background: color-mix(in srgb, var(--ink) 60%, transparent); }
.gauge b { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--ember), var(--flare)); }
.fever.on .k { color: var(--flare); opacity: 1; animation: blink .25s steps(2) infinite; }
.fever.on .gauge b { background: linear-gradient(90deg, #ff4a3d, #ffd25e, #9aae5c, #5ac8ff, #c86bff, #ff4a3d); background-size: 200% 100%; animation: slide .6s linear infinite; }
@keyframes blink { 50% { opacity: .45; } }
@keyframes slide { to { background-position: 200% 0; } }
.spacer { flex: 1; }
.mute {
  pointer-events: auto;
  font: 700 13px var(--body); color: var(--bone);
  background: transparent; border: 2px solid var(--bone); border-radius: 6px;
  padding: 4px 10px; cursor: pointer; opacity: .8;
}
.mute:focus-visible, .btn:focus-visible { outline: 3px solid var(--flare); outline-offset: 2px; }
@media (max-width: 440px) {
  .hud { gap: 6px 12px; }
  .stat .v { font-size: 18px; }
  .stat.time .v { font-size: 24px; }
  .gauge { width: 76px; }
}

.overlay {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--night) 66%, transparent);
  cursor: default;
}
.card { max-width: 480px; width: 100%; display: flex; flex-direction: column; gap: 14px; text-align: center; align-items: center; }
.logo {
  font-family: var(--display); font-size: clamp(48px, min(21vw, 15vh), 104px); line-height: 1;
  color: var(--flare);
  text-shadow: 0 4px 0 var(--ember), 0 10px 30px color-mix(in srgb, var(--ember) 60%, transparent);
  text-wrap: balance; margin: 0;
}
.tag { margin: 0; font-size: 15px; opacity: .85; }
.btn {
  font: inherit; color: var(--ink);
  background: var(--bone); border: 0; border-radius: 10px;
  padding: 14px 34px; cursor: pointer;
  box-shadow: 0 5px 0 var(--ember);
  transition: transform .08s;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ember); }
.btn .t { font-family: var(--display); font-size: 22px; }
.btn .d { font-size: 13px; font-weight: 500; opacity: .75; }
.btn.small { padding: 10px 22px; }
.btn.small .t { font-size: 17px; }
.controls { display: flex; gap: 10px 18px; flex-wrap: wrap; justify-content: center; }
.ctl { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
.key { font-family: var(--display); font-size: 13px; color: var(--ink); background: var(--flare); border-radius: 6px; padding: 3px 8px; box-shadow: 0 3px 0 var(--ember); }
.how { font-size: 13px; opacity: .75; margin: 0; line-height: 1.7; text-wrap: balance; }
.tag span, .how span { display: inline-block; }
.rank {
  font-family: var(--display); font-size: clamp(80px, 26vw, 140px); line-height: 1; margin: 0;
  color: var(--flare); text-shadow: 0 6px 0 var(--ember), 0 0 40px color-mix(in srgb, var(--ember) 70%, transparent);
}
.rank-note { font-family: var(--display); font-size: 18px; margin: -6px 0 0; }
.score-big { font-family: var(--display); font-size: clamp(30px, 9vw, 46px); margin: 0; line-height: 1.1; font-variant-numeric: tabular-nums; }
.score-big small { display: block; font-family: var(--body); font-size: 12px; font-weight: 700; letter-spacing: .14em; opacity: .7; }
.result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
.result-grid div { background: color-mix(in srgb, var(--bone) 10%, transparent); border-radius: 8px; padding: 8px 4px; min-width: 0; }
.result-grid .k { font-size: 11px; letter-spacing: .1em; opacity: .7; }
.result-grid .v { font-family: var(--display); font-size: 22px; font-variant-numeric: tabular-nums; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.badges:empty { display: none; }
.badges span { font-family: var(--display); font-size: 13px; color: var(--ink); background: var(--flare); padding: 4px 10px; border-radius: 999px; }
.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
@media (prefers-reduced-motion: reduce) { .fever.on .k, .fever.on .gauge b { animation: none; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>

  <div class="hud" id="hud" hidden>
    <div class="stat time"><span class="k">残り</span><span class="v" id="time">15.0</span></div>
    <div class="stat"><span class="k">スコア</span><span class="v" id="score">0</span></div>
    <div class="stat"><span class="k">ロケット</span><span class="ammo" id="ammo"></span></div>
    <div class="stat fever" id="feverWrap"><span class="k" id="feverLabel">FEVER</span><span class="gauge"><b id="feverBar"></b></span></div>
    <span class="spacer"></span>
    <button class="mute" id="mute" type="button">音: ON</button>
  </div>

  <div class="overlay" id="title">
    <div class="card">
      <h1 class="logo">ゾンビ<br>爆散</h1>
      <p class="tag"><span>ここが最終防衛ライン。</span><span>15秒で全部ぶっ飛ばせ。</span></p>
      <button class="btn" id="startBtn" type="button">
        <span class="t">スタート</span>
        <span class="d">15秒アタック</span>
      </button>
      <div class="controls">
        <div class="ctl"><span class="key">長押し</span>マシンガン</div>
        <div class="ctl"><span class="key">タップ</span>ロケット</div>
      </div>
      <p class="how"><span>ドラム缶と車は大爆発、</span><span>ビルは撃てば崩れる。</span><br><span>倒し続けるとFEVER。</span><span>巨大ゾンビは月まで飛ばせ。</span><br>PCは右クリックかスペースでもロケット。</p>
    </div>
  </div>

  <div class="overlay" id="result" hidden>
    <div class="card">
      <p class="rank" id="resRank">A</p>
      <p class="rank-note" id="resNote"></p>
      <p class="score-big"><small>SCORE</small><span id="resScore">0</span></p>
      <div class="result-grid">
        <div><div class="k">撃破</div><div class="v" id="resKills">0</div></div>
        <div><div class="k">最大コンボ</div><div class="v" id="resCombo">0</div></div>
        <div><div class="k">最長飛距離</div><div class="v" id="resFlight">0m</div></div>
      </div>
      <div class="badges" id="resBadges"></div>
      <p class="tag" id="resBest"></p>
      <div class="row">
        <button class="btn small" id="again" type="button"><span class="t">もう一回</span></button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const C = {
  night: '#1d1426', dusk: '#4a2340', ember: '#ff7a2f', flare: '#ffd25e', blood: '#ff4a3d',
  rot: '#9aae5c', rotDark: '#5e6f37', stump: '#7d9a3a', bone: '#f3e9dc', ink: '#120c17', moon: '#ffb36b',
  shirt: ['#6b5a7a', '#5a6e7f', '#7f5a55', '#4f6650', '#7a6a4a'],
};

// ---------- camera: world x (left/right), z (distance), h (height) ----------
const CAM_H = 2.3, Z_WALL = 5, Z_FAR = 26, ZOMBIE_H = 1.75, DRAW_H = 78;
let W = 0, H = 0, DPR = 1, F = 1, horizon = 0, halfX = 4, hudH = 60;
const moon = { x: 0, y: 0, r: 0 };
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  horizon = H * 0.33;
  F = (H * 0.9 - horizon) * Z_WALL / CAM_H;   // barricade line sits at 90% height
  halfX = Math.min(5, (W / 2) * Z_WALL / F * 0.92);
  moon.r = Math.min(W, H) * 0.08;
  moon.x = W / 2;   // hangs over the far end of the avenue, between the buildings
  moon.y = Math.min(Math.max(horizon * 0.45, moon.r + 90), horizon - moon.r - 8);
  if (!$('hud').hidden) hudH = $('hud').offsetHeight + 10;
  buildBackdrop();
}
const sx = (x, z) => W / 2 + x * F / z;
const sy = (z, h = 0) => horizon + F * (CAM_H - h) / z;
const scaleAt = z => F / z;
function toGround(px, py) {
  const dy = Math.max(1, py - horizon);
  const z = clamp(F * CAM_H / dy, Z_WALL + 0.6, Z_FAR - 2);
  const x = (px - W / 2) * z / F;
  return { x: clamp(x, -halfX * 1.8, halfX * 1.8), z };
}
function groundEllipse(x, z, r) {
  const zn = Math.max(1.2, z - r), zf = z + r;
  const yN = sy(zn), yF = sy(zf);
  return { cx: sx(x, z), cy: (yN + yF) / 2, rx: Math.max(1, r * F / z), ry: Math.max(1, (yN - yF) / 2) };
}

// ---------- audio ----------
let actx = null, muted = false, noiseBuf = null, master = null, musicBus = null, mainOut = null, distCurve = null;
try { muted = localStorage.getItem('zb-muted') === '1'; } catch (e) {}
function makeCurve(k) {
  const n = 1024, c = new Float32Array(n);
  for (let i = 0; i < n; i++) { const x = i * 2 / n - 1; c[i] = (1 + k) * x / (1 + k * Math.abs(x)); }
  return c;
}
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const len = actx.sampleRate * 2.5;
    noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    distCurve = makeCurve(30);
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 6; comp.ratio.value = 6; comp.attack.value = 0.002; comp.release.value = 0.25;
    mainOut = actx.createGain(); mainOut.gain.value = muted ? 0 : 1;
    comp.connect(mainOut).connect(actx.destination);
    master = actx.createGain(); master.gain.value = 0.85; master.connect(comp);
    musicBus = actx.createGain(); musicBus.gain.value = 0.3; musicBus.connect(comp);
    // voices: the announcer gets a big hall echo, the groans a little of it
    const verb = actx.createConvolver(); verb.buffer = makeVerb(1.5);
    const wet = actx.createGain(); wet.gain.value = 0.3; verb.connect(wet).connect(comp);
    voiceIn = actx.createGain(); voiceIn.gain.value = 1.15; voiceIn.connect(comp); voiceIn.connect(verb);
    groanIn = actx.createGain(); groanIn.gain.value = 0.85; groanIn.connect(comp);
    const gw = actx.createGain(); gw.gain.value = 0.35; groanIn.connect(gw).connect(verb);
    // blasts slap back off the buildings down the avenue
    echoIn = actx.createGain(); echoIn.gain.value = 0.35;
    const dl = actx.createDelay(1); dl.delayTime.value = 0.21;
    const elp = filt('lowpass', 1400), fb = actx.createGain(); fb.gain.value = 0.38;
    echoIn.connect(dl).connect(elp).connect(fb).connect(dl); elp.connect(comp);
    loadVoices();
    // unlock audio on iOS with a silent blip inside the tap
    const sb = actx.createBufferSource(); sb.buffer = actx.createBuffer(1, 1, 22050); sb.connect(actx.destination); sb.start(0);
  } catch (e) { actx = null; }
}
const live = () => actx && !muted;
function noiseSrc(t, dur) {
  const src = actx.createBufferSource(); src.buffer = noiseBuf;
  src.playbackRate.value = rand(0.8, 1.2);
  src.start(t, Math.random() * 0.4); src.stop(t + dur);
  return src;
}
function filt(type, f, q) { const b = actx.createBiquadFilter(); b.type = type; b.frequency.value = f; if (q) b.Q.value = q; return b; }
function osc(type, f, t) { const o = actx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); return o; }
function gain(t, peak, attack, decay) {
  const g = actx.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
  return g;
}
function gunShot(fev) {
  if (!live()) return;
  const t = actx.currentTime;
  noiseSrc(t, 0.08).connect(filt('bandpass', rand(1300, 1900), 0.8)).connect(gain(t, fev ? 0.5 : 0.42, 0.002, 0.06)).connect(master);
  const o = osc('triangle', 190, t); o.frequency.exponentialRampToValueAtTime(50, t + 0.06);
  o.connect(gain(t, 0.5, 0.002, 0.07)).connect(master); o.start(t); o.stop(t + 0.09);
}
function rocketSnd() {
  if (!live()) return;
  const t = actx.currentTime;
  const bp = filt('bandpass', 500, 1.2); bp.frequency.setValueAtTime(500, t); bp.frequency.exponentialRampToValueAtTime(3200, t + 0.35);
  noiseSrc(t, 0.45).connect(bp).connect(gain(t, 0.45, 0.01, 0.4)).connect(master);
  const o = osc('sine', 120, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.15);
  o.connect(gain(t, 0.6, 0.003, 0.15)).connect(master); o.start(t); o.stop(t + 0.2);
}
// layered explosion: crack + distorted body + two sub thumps + rumble tail + crackling debris; the body
// also goes into the street echo. Quieter when far away.
let echoIn = null;
function boom(size = 1, z = 10) {
  if (!live()) return;
  const t = actx.currentTime;
  const near = clamp(14 / z, 0.45, 1.25) * Math.min(size, 1.6);
  noiseSrc(t, 0.1).connect(filt('highpass', 1800)).connect(gain(t, 0.9 * near, 0.001, 0.09)).connect(master);
  const lp = filt('lowpass', 4200, 1.5); lp.frequency.setValueAtTime(4200, t); lp.frequency.exponentialRampToValueAtTime(90, t + 1.3);
  const sh = actx.createWaveShaper(); sh.curve = distCurve;
  const body = gain(t, 1.0 * near, 0.008, 1.4);
  noiseSrc(t, 1.5).connect(sh).connect(lp).connect(body).connect(master);
  if (echoIn) body.connect(echoIn);
  const o = osc('sine', rand(140, 170), t); o.frequency.exponentialRampToValueAtTime(32, t + 0.55);
  o.connect(gain(t, 1.2 * near, 0.002, 0.6)).connect(master); o.start(t); o.stop(t + 0.65);
  const o2 = osc('sine', 75, t); o2.frequency.exponentialRampToValueAtTime(24, t + 0.9);
  o2.connect(gain(t, 0.9 * near, 0.004, 1.0)).connect(master); o2.start(t); o2.stop(t + 1.05);
  noiseSrc(t, 2.0).connect(filt('lowpass', 220)).connect(gain(t + 0.05, 0.7 * near, 0.15, 1.8)).connect(master);
  for (let i = 0; i < 9; i++) {
    const tt = t + rand(0.2, 1.3);
    noiseSrc(tt, 0.05).connect(filt('bandpass', rand(900, 3200), 6)).connect(gain(tt, rand(0.12, 0.28) * near, 0.002, 0.045)).connect(master);
  }
}
function thud() {
  if (!live()) return;
  const t = actx.currentTime;
  noiseSrc(t, 0.13).connect(filt('lowpass', 400)).connect(gain(t, 0.3, 0.002, 0.12)).connect(master);
}
function whoosh() {
  if (!live()) return;
  const t = actx.currentTime;
  const bp = filt('bandpass', 600, 2); bp.frequency.setValueAtTime(600, t); bp.frequency.exponentialRampToValueAtTime(2400, t + 0.3);
  noiseSrc(t, 0.4).connect(bp).connect(gain(t, 0.3, 0.06, 0.3)).connect(master);
}
function bangSnd() {
  if (!live()) return;
  const t = actx.currentTime;
  // the wire rattles on its posts: a dull thump under a metallic jangle
  noiseSrc(t, 0.12).connect(filt('lowpass', 300)).connect(gain(t, 0.2, 0.002, 0.1)).connect(master);
  for (let i = 0; i < 3; i++) {
    const tt = t + i * rand(0.025, 0.05);
    noiseSrc(tt, 0.06).connect(filt('bandpass', rand(2200, 3600), 6)).connect(gain(tt, 0.12, 0.001, 0.05)).connect(master);
  }
}
// a block coming down: a long low roar with concrete cracking through it
function rumble() {
  if (!live()) return;
  const t = actx.currentTime;
  noiseSrc(t, 2.2).connect(filt('lowpass', 150)).connect(gain(t, 0.9, 0.05, 2.0)).connect(master);
  for (let i = 0; i < 7; i++) {
    const tt = t + rand(0.1, 1.4);
    noiseSrc(tt, 0.12).connect(filt('bandpass', rand(500, 1800), 1.5)).connect(gain(tt, 0.2, 0.003, 0.1)).connect(master);
  }
}
function roar() {
  if (!live()) return;
  const t = actx.currentTime;
  if (voiceBufs.roar) {
    const src = actx.createBufferSource(); src.buffer = voiceBufs.roar; src.playbackRate.value = rand(0.85, 0.95);
    const g = actx.createGain(); g.gain.value = 1.3; src.connect(g).connect(groanIn); src.start(t);
  }
  const o = osc('sawtooth', 78, t); o.frequency.linearRampToValueAtTime(46, t + 1.4);
  const lfo = osc('sine', 9, t), lg = actx.createGain(); lg.gain.value = 9; lfo.connect(lg).connect(o.frequency);
  o.connect(filt('lowpass', 700)).connect(gain(t, 0.35, 0.15, 1.3)).connect(master);
  o.start(t); o.stop(t + 1.5); lfo.start(t); lfo.stop(t + 1.5);
  noiseSrc(t, 1.4).connect(filt('lowpass', 420)).connect(gain(t, 0.3, 0.2, 1.1)).connect(master);
}
function sting() {
  if (!live()) return;
  const t = actx.currentTime;
  for (const [type, f] of [['sawtooth', 220], ['square', 330]]) {
    const o = osc(type, f, t); o.frequency.exponentialRampToValueAtTime(f * 4, t + 0.5);
    o.connect(filt('lowpass', 3200)).connect(gain(t, 0.16, 0.02, 0.6)).connect(master); o.start(t); o.stop(t + 0.7);
  }
}
function comboSting() {
  if (!live()) return;
  const t = actx.currentTime;
  [0, 4, 7, 12].forEach((n, i) => {
    const tt = t + i * 0.055, o = osc('square', 523 * Math.pow(2, n / 12), tt);
    o.connect(filt('lowpass', 3500)).connect(gain(tt, 0.1, 0.004, 0.09)).connect(master); o.start(tt); o.stop(tt + 0.12);
  });
}
function softClick() {
  if (!live()) return;
  const t = actx.currentTime;

    cl.t += dt;
    // dust keeps boiling out from where the floors come down
    if (cl.t < cl.T && Math.random() < dt * 18) {
      const hh = cl.hgt * (1 - (cl.t / cl.T) ** 2);
      parts.push({ k: 'dust', x: cl.xs - cl.sd * rand(0, 1), z: rand(cl.za, cl.zb), h: rand(0, Math.max(0.5, Math.min(hh, 12))), vx: -cl.sd * rand(0.5, 2.5), vz: rand(-0.3, 0.6), vh: rand(0.2, 1), r: rand(0.6, 1.2), grow: rand(0.8, 1.5), life: rand(1.6, 2.6), max: 2.6 });
    }
  }
  collapses = collapses.filter(cl => cl.t < cl.T + 0.1);
  // damaged blocks smolder, ruins send up a thick column
  if ((smolderT -= dt) <= 0) {
    smolderT = 0.14;
    const hurt = city.blocks.filter(bl => (bl.st.holes.length || bl.st.ruined) && bl.z1 > Z_WALL + 1);
    if (hurt.length) {
      const bl = pick(hurt), za = Math.max(bl.z0, Z_WALL + 0.5);
      if (bl.st.ruined) parts.push({ k: 'smoke', x: bl.X - bl.sd * rand(0.1, 1), z: rand(za, bl.z1), h: rand(0.8, ruinH(bl) + 0.5), vx: -bl.sd * rand(0.05, 0.3), vz: rand(-0.1, 0.2), vh: rand(1.2, 2.2), r: rand(0.45, 0.8), grow: 0.9, life: 3, max: 3, lit: true });
      else {
        const ho = pick(bl.st.holes);
        parts.push({ k: 'smoke', x: bl.X - bl.sd * 0.3, z: ho.z, h: ho.h + ho.r * 0.4, vx: -bl.sd * rand(0.1, 0.4), vz: rand(-0.1, 0.2), vh: rand(0.6, 1.3), r: rand(0.3, 0.5), grow: 0.8, life: 2.4, max: 2.4 });
      }
    }
  }
}

// ---------- input: hold = machine gun, quick tap = rocket ----------
function pt(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function setAim(p, touch) {
  aim.x = p.x; aim.y = touch ? p.y - 50 : p.y;   // keep the reticle above the finger
  aim.touch = touch; aim.show = true;
}
cv.addEventListener('pointerdown', e => {
  initAudio();
  if (!running) return;
  const p = pt(e), touch = e.pointerType !== 'mouse';
  if (e.button === 2) { setAim(p, false); tryRocket(); return; }
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  pointers.set(e.pointerId, { sx: p.x, sy: p.y, t: performance.now(), moved: 0, fire: true });
  setAim(p, touch);
});
cv.addEventListener('pointermove', e => {
  const p = pt(e), touch = e.pointerType !== 'mouse';
  const ptr = pointers.get(e.pointerId);
  if (ptr) { ptr.moved = Math.max(ptr.moved, Math.hypot(p.x - ptr.sx, p.y - ptr.sy)); setAim(p, touch); }
  else if (!touch) setAim(p, false);
});
function endPointer(e) {
  const ptr = pointers.get(e.pointerId);
  if (!ptr) return;
  pointers.delete(e.pointerId);
  if (running && performance.now() - ptr.t < 220 && ptr.moved < 28) tryRocket();
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', e => pointers.delete(e.pointerId));
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !pointers.size) aim.show = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (e.code === 'Space' && running) { e.preventDefault(); if (!e.repeat) tryRocket(); }
});

}

// ---------- game flow ----------
function start() {
  initAudio();
  reset(); running = true;
  spawnWave(12); spawnWave(16.5); spawnTimer = 0.6;
  $('title').hidden = true; $('result').hidden = true; $('hud').hidden = false;
  hudH = $('hud').offsetHeight + 10;
  startMusic();
  showBanner("LET'S ROCK!!", 'ここが最終防衛ライン!', C.flare, 1.3);
  sayWhenReady('go', 3);
}
function timeUp() {
  running = false; endT = 1.5; pointers.clear(); firing = false; feverT = 0; fever = 0;
  musicOn = false; endSting();
  showBanner('FINISH!!', 'TIME UP', C.bone, 1.4, true); say('finish', 3);
}
function finish() {
  endT = 0;
  const i = RANKS.findIndex(r => score >= r.min);
  $('resRank').textContent = RANKS[i].r;
  say(['incredible', 'excellent', 'great', 'nice'][i], 3);
  $('resNote').textContent = i > 0
    ? `ナイス爆破! あと${(RANKS[i - 1].min - score).toLocaleString()}点で${RANKS[i - 1].r}`
    : moonBroken ? '月まで壊すとは…' : '爆破マスター!';
  $('resScore').textContent = score.toLocaleString();
  $('resKills').textContent = kills;
  $('resCombo').textContent = maxCombo;
  $('resFlight').textContent = `${longestFlight | 0}m`;
  const badges = [];
  if (bossKilled) badges.push('巨大ゾンビ撃破');
  if (moonBroken) badges.push('月を破壊');
  if (moonHits) badges.push(`月面着弾 ×${moonHits}`);
  if (headshots) badges.push(`HEADSHOT ×${headshots}`);
  if (bldDown) badges.push(`ビル倒壊 ×${bldDown}`);
  $('resBadges').innerHTML = badges.map(b => `<span>${b}</span>`).join('');
  let best = '';
  try {
    const prev = JSON.parse(localStorage.getItem('zb-v7-best') || 'null');
    if (!prev || score > prev.score) {
      localStorage.setItem('zb-v7-best', JSON.stringify({ score }));
      best = prev ? 'ベスト更新!' : '';
    } else best = `ベスト: ${prev.score.toLocaleString()}`;
  } catch (e) {}
  $('resBest').textContent = best;
  $('hud').hidden = true; $('result').hidden = false;
  try { $('again').focus({ preventScroll: true }); } catch (e) {}
}
$('startBtn').addEventListener('click', start);
$('again').addEventListener('click', start);

// ---------- update ----------
const BODY_G = 11, G = 18;
function fxDecay(raw) {
  shake *= Math.pow(0.0015, raw);
  flashScreen = Math.max(0, flashScreen - raw);
  speedLines = Math.max(0, speedLines - raw * 1.2);
  zoom += (1 - zoom) * Math.min(1, raw * 6);
  moonFlash = Math.max(0, moonFlash - raw);
  muzzleT = Math.max(0, muzzleT - raw);
  gunRecoil = Math.max(0, gunRecoil - raw * 14);
  tubeRecoil = Math.max(0, tubeRecoil - raw * 4);
  wallWob = Math.max(0, wallWob - raw * 3);
  comboPulse = Math.max(0, comboPulse - raw * 6);
  bangCD -= raw; thudCD -= raw; gurgleT -= raw;
  if (slowmo > 0) slowmo -= raw;
  if (moonBroken) moonBreakT += raw;
  if (bannerObj) { bannerObj.life -= raw; if (bannerObj.life <= 0) bannerObj = null; }
  for (const t of tracers) t.life -= raw;
  tracers = tracers.filter(t => t.life > 0);
}
function update(dt, raw) {
  fxDecay(raw);
  if (hitstop > 0) { hitstop -= raw; return; }
  if (running) {
    elapsed += dt;
    if (!bossSpawned && elapsed >= BOSS_AT) spawnBoss();
    spawnTimer -= dt;
    if (spawnTimer <= 0) { spawnWave(); spawnTimer = spawnInterval(); }
    if ((groanT -= dt) <= 0) {
      // the horde moans the whole time; the nearest ones are the loudest
      groanT = rand(0.3, 0.75);
      const walkers = zombies.filter(z => z.state === 'walk' && z.type !== 'boss');
      if (walkers.length) {
        let zb = pick(walkers);
        for (let i = 0; i < 2; i++) { const o = pick(walkers); if (o.z < zb.z) zb = o; }
        moanAt(zb, pick(MOANS), rand(0.82, 1.12) * (zb.type === 'runner' ? 1.15 : zb.type === 'tank' ? 0.8 : 1), zb.z < Z_WALL + 1 ? 1.25 : 1);
      }
    }
    if (rocketsLeft < MAX_ROCKETS) { rocketTimer += dt; if (rocketTimer >= ROCKET_REFILL) { rocketTimer = 0; rocketsLeft++; } } else rocketTimer = 0;
    if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) combo = 0; }
    if (feverT > 0) { feverT -= dt; fever = Math.max(0, feverT / FEVER_TIME * 100); if (feverT <= 0) { feverT = 0; fever = 0; } }
    firing = false;
    for (const p of pointers.values()) if (p.fire) firing = true;
    fireCD -= dt;
    if (firing && fireCD <= 0) { fireCD = feverT > 0 ? 1 / 26 : 1 / 13; shootBullet(); }
    if (elapsed >= DURATION) timeUp();
  } else if (endT > 0) {
    endT -= raw;
    if (endT <= 0) { if (bossBusy()) endT = 0.15; else finish(); }
  }

  for (const q of explosionsQ) q.t -= dt;
  const ready = explosionsQ.filter(q => q.t <= 0);
  explosionsQ = explosionsQ.filter(q => q.t > 0);
  for (const q of ready) {
    if (q.pop) pop(q.x, q.z, q.power); else explode(q.x, q.z, q.power || 1.3);
    if (q.car) carParts(q);
  }

  for (const r of rockets) {
    r.t += dt;
    for (let s = 0; s < 2; s++) {
      r.x += r.vx * dt / 2; r.z += r.vz * dt / 2; r.h += r.vh * dt / 2;
      parts.push({ k: 'smoke', x: r.x, z: r.z, h: r.h, vx: rand(-0.3, 0.3), vz: 0, vh: rand(0.2, 0.6), r: 0.16, grow: 0.9, life: 0.7, max: 0.9 });
    }
    parts.push({ k: 'spark', x: r.x, z: r.z, h: r.h, vx: 0, vz: 0, vh: 0, r: 0.08, life: 0.12, max: 0.12 });
    let hitZ = null, hitC = null;
    for (const z of zombies) {
      if (z.state !== 'walk' || Math.abs(z.z - r.z) > 0.8 * Math.max(1, z.size * 0.5)) continue;
      if (Math.abs(z.x - r.x) < 0.45 * z.size && r.h < ZOMBIE_H * z.size) { hitZ = z; break; }
    }
    if (!hitZ) hitC = cars.find(c => (c.state === 'park' || c.state === 'roll') && Math.abs(c.x - r.x) < 0.9 && Math.abs(c.z - r.z) < 2 && r.h < 1.5);
    if (hitZ || hitC || r.t >= r.T) {
      r.done = true;
      if (hitZ && hitZ.type === 'boss') damageBoss(18);
      const bl = !hitZ && !hitC && r.bid >= 0 ? city.blocks[r.bid] : null;
      if (bl && !bl.st.ruined) facadeBlast(bl, r.z, r.h, 1.15);
      else explode(r.x, r.z, 1.25);
    }
  }
  rockets = rockets.filter(r => !r.done);
  updateCars(dt); updateBuildings(dt);

  for (const z of zombies) {
    z.flash = Math.max(0, z.flash - dt);
    if (z.state === 'walk') {
      const slow = z.stagger > 0 ? 0.25 : 1;
      z.stagger = Math.max(0, z.stagger - dt);
      const wallZ = Z_WALL + 0.35 + (z.size - 1) * 0.8 + (z.type === 'boss' ? 5.7 : 0);
      if (z.z > wallZ) {
        z.z -= z.speed * slow * dt;
        z.phase += dt * (z.type === 'runner' ? 14 : z.type === 'boss' ? 4 : 7);
        z.x = clamp(z.x + Math.sin(z.phase * 0.5) * z.sway * dt, -halfX * 1.2, halfX * 1.2);
      } else {
        // the barricade never breaks: zombies just pound on it
        z.attackT += dt; z.phase += dt * 5;
        if (running && z.attackT > (z.type === 'boss' ? 1.0 : 0.7)) { z.attackT = 0; barricadeHit(z.type === 'boss'); }
      }
    } else if (z.state === 'fly') {
      z.x += z.vx * dt; z.z += z.vz * dt; z.vh -= BODY_G * dt; z.h += z.vh * dt; z.rot += z.spin * dt;
      longestFlight = Math.max(longestFlight, Math.hypot(z.x - z.launchX, z.z - z.launchZ));
      if (Math.random() < dt * 10) parts.push({ k: 'goo', x: z.x, z: z.z, h: z.h + 0.8 * z.size, vx: z.vx * 0.15, vz: z.vz * 0.15, vh: rand(0, 2), r: rand(0.04, 0.08), life: 0.9, max: 0.9 });
      if (z.headless && Math.random() < dt * 14) parts.push({ k: 'goo', x: z.x, z: z.z, h: z.h + 1.4 * z.size, vx: rand(-1.5, 1.5), vz: rand(-1.5, 1.5), vh: rand(3, 7), r: rand(0.05, 0.09), life: 0.9, max: 0.9 });
      if (z.z < 1.6) { z.gone = true; flyPast(sx(z.x, 1.6), true); continue; }
      if (!moonBroken && z.z > 18) {
        const b = bodyBox(z), cy = b.Yf - b.k * 0.45;
        if (Math.hypot(b.X - moon.x, cy - moon.y) < moon.r * 0.6) { moonHit(z, b.X, cy); continue; }
      }
      if (z.h <= 0 && z.vh < 0) {
        if (z.bounces === 0) {
          const d = Math.hypot(z.x - z.launchX, z.z - z.launchZ);
          if (d >= 30 && z.z < Z_FAR + 10) floaters.push({ x: z.x, z: z.z, h: 1.5, text: `${d | 0}m!`, sub: '', life: 0.9, big: false });
        }
        z.h = 0; z.vh *= -0.38; z.vx *= 0.6; z.vz *= 0.6; z.spin *= 0.6; z.bounces++;
        if (thudCD <= 0) { thud(); thudCD = 0.06; }
        for (let i = 0; i < 4; i++) parts.push({ k: 'puff', x: z.x + rand(-0.5, 0.5), z: z.z, h: 0.2, vx: rand(-1, 1), vz: 0, vh: 0.6, r: 0.3, life: 0.6, max: 0.6 });
        if (Math.abs(z.vh) < 2) { z.state = 'dead'; z.vh = 0; z.dead = 0; z.rest = (Math.sign(Math.sin(z.rot)) || 1) * Math.PI / 2; }
      }
    } else if (z.state === 'dead') {
      z.dead += dt; z.rot += (z.rest - z.rot) * Math.min(1, dt * 10);
      z.vx *= 0.9; z.vz *= 0.9; z.x += z.vx * dt; z.z += z.vz * dt;
    } else if (z.state === 'dying') {
      z.dyingT += raw;
      z.flash = (z.dyingT * 16 | 0) % 2 ? 0.05 : 0;
      z.x += rand(-0.03, 0.03);
      if (z.dyingT > 1.0) startMoonshot(z);
    } else if (z.state === 'moonshot') {
      z.ms.t += raw;
      const p = msPos(z);
      sparts.push({ k: 'trail', x: p.X + rand(-6, 6), y: p.Y + rand(-6, 6), r: Math.max(6, p.kpx * 0.25), life: 0.45, max: 0.45 });
      if (z.ms.t >= z.ms.T) moonShatter(z);
    }
  }
  // bowling: fast bodies knock down the zombies they fly into
  for (const fz of zombies) {
    if (fz.state !== 'fly' || fz.h > 2.2 || Math.hypot(fz.vx, fz.vz) < 6) continue;
    for (const wz of zombies) {
      if (wz.state !== 'walk' || wz.type === 'boss') continue;
      const dx = wz.x - fz.x, dz = wz.z - fz.z, d = Math.hypot(dx, dz);
      if (d > 0.9) continue;
      killZombie(wz, { dx: dx + fz.vx * 0.05, dz: dz + fz.vz * 0.05, d: d + 0.01, f: 0.55, power: 0.9 });
      registerKills(1, wz.x, wz.z, 'ストライク!', false); say('strike', 1);
    }
  }
  // a flying car flattens whatever it comes down on
  for (const c of cars) {
    if (c.state !== 'fly' || c.h > 2.5) continue;
    for (const wz of zombies) {
      if (wz.state !== 'walk' || wz.type === 'boss') continue;
      const dx = wz.x - c.x, dz = wz.z - c.z, d = Math.hypot(dx, dz);
      if (d > 1.8) continue;
      killZombie(wz, { dx, dz, d: d + 0.01, f: 0.6, power: 1 });
      registerKills(1, wz.x, wz.z, 'ストライク!', false); say('strike', 1);
    }
  }
  zombies = zombies.filter(z => !z.gone && !(z.state === 'dead' && z.dead > 2.2) && z.z < Z_FAR + 60 && Math.abs(z.x) < 60);

  let nFire = 0;
  for (const p of parts) {
    p.life -= dt;
    switch (p.k) {
      case 'fire': p.x += p.vx * dt; p.z += p.vz * dt; p.h += p.vh * dt; p.vx *= 0.9; p.vz *= 0.9; p.vh *= 0.9; nFire++; break;
      case 'smoke': case 'dust': p.x += p.vx * dt; p.z += p.vz * dt; p.h += p.vh * dt; p.vx *= 0.97; p.vz *= 0.97; p.r += (p.grow || 0.5) * dt; break;
      case 'puff': p.x += p.vx * dt; p.h += p.vh * dt; p.r += 0.6 * dt; break;
      case 'ember': p.x += p.vx * dt; p.z += p.vz * dt; p.h += p.vh * dt; break;
      case 'spark': break;
      case 'shock': p.r += (p.R - p.r) * Math.min(1, dt * 22); break;
      case 'core': break;
      case 'flame':   // fuel left burning on the road keeps throwing up little flames
        if ((p.ft = (p.ft || 0) - dt) <= 0) {
          p.ft = rand(0.08, 0.13);
          parts.push({ k: 'fire', x: p.x + rand(-0.6, 0.6) * p.r, z: p.z + rand(-0.15, 0.15), h: 0.05, vx: rand(-0.3, 0.3), vz: 0, vh: rand(1.5, 3), r: p.r * rand(0.35, 0.6) * Math.min(1, p.life * 1.5), life: rand(0.3, 0.5), max: 0.55 });
        }
        break;
      case 'plume': case 'cap': {   // rising fire and smoke that slow to a stop at the top of the column
        p.x += p.vx * dt; p.z += p.vz * dt; p.h += p.vh * dt;
        const d = Math.max(0, 1 - (p.k === 'plume' ? 2.6 : 1.8) * dt), e = Math.max(0, 1 - (p.k === 'plume' ? 2.6 : 0.8) * dt);
        p.vh *= d; p.vx *= e; p.vz *= e;

        break;
      }
      case 'kick': {
        p.x += p.vx * dt; p.z += p.vz * dt; p.h += p.vh * dt;
        const d = Math.max(0, 1 - 3.5 * dt);
        p.vx *= d; p.vz *= d; p.vh *= d; p.r += p.grow * dt;
        break;
      }
      case 'brand': case 'wheel': case 'panel':
        p.x += p.vx * dt; p.z += p.vz * dt; p.vh -= G * dt; p.h += p.vh * dt;
        if (p.spin) p.rot += p.spin * dt;
        if (p.h < 0 && p.vh < 0) {
          p.h = 0; p.vh *= p.k === 'wheel' ? -0.45 : -0.25; p.vx *= 0.6; p.vz *= 0.6;
          if (p.k === 'brand') p.life = Math.min(p.life, 0.5);
        }
        if (p.tr) { p.tr.push(p.x, p.z, p.h); if (p.tr.length > 30) p.tr.splice(0, 3); }
        break;

      case 'mist': p.r += (p.R - p.r) * Math.min(1, dt * 9); p.h += 0.4 * dt; break;
      case 'debris': case 'goo': case 'head': case 'limb': case 'gib': case 'bone': case 'torso':
        p.x += p.vx * dt; p.z += p.vz * dt; p.vh -= G * dt; p.h += p.vh * dt;
        if (p.rot !== undefined) p.rot += (p.spin || 8) * dt;
        if (p.k === 'head' && p.z < 1.6) { p.life = 0; flyPast(sx(p.x, 1.6), false); break; }
        if (p.h < 0 && p.vh < 0) {
          p.h = 0; p.vh *= -0.3; p.vx *= 0.5; p.vz *= 0.5; if (p.spin) p.spin *= 0.5;
          if ((p.k === 'goo' || p.k === 'gib') && !p.splat) { p.splat = true; decals.push({ x: p.x, z: p.z, r: p.r * 3, life: 1, goo: true }); }
        }
        break;
    }
  }

  fireLoad = clamp(150 / Math.max(1, nFire), 0.4, 1);
  // the barricade stops blast and gore coming at us: only flying body parts get through to the camera
  parts = parts.filter(p => p.life > 0 && p.z > 1.2 && (NEAR_OK[p.k] || !(p.vz < 0) || p.z > Z_WALL));
  if (parts.length > 1100) parts.splice(0, parts.length - 1100);
  for (const p of sparts) {
    p.life -= raw;
    if (p.k === 'casing') { p.x += p.vx * raw; p.vy += 1400 * raw; p.y += p.vy * raw; p.rot += p.spin * raw; }
    else if (p.k === 'blast') { p.x += p.vx * raw; p.y += p.vy * raw; p.vx *= 0.92; p.vy *= 0.92; p.r += 30 * raw; }
    else if (p.k === 'chunk') { p.x += p.vx * raw; p.y += p.vy * raw; p.vy += 60 * raw; p.rot += p.spin * raw; }
  }
  sparts = sparts.filter(p => p.life > 0);
  for (const d of decals) d.life -= dt * (d.goo ? 0.12 : 0.06);
  decals = decals.filter(d => d.life > 0);
  if (decals.length > 90) decals.splice(0, decals.length - 90);
  for (const f of floaters) { f.life -= raw; if (f.sfx) continue; if (f.screen) f.y -= 30 * raw; else f.h += 1.2 * raw; }
  floaters = floaters.filter(f => f.life > 0);
  if (floaters.length > 40) floaters.splice(0, floaters.length - 40);
}

  ctx.save(); ctx.globalAlpha = Math.min(1, a) * 0.45; ctx.fillStyle = '#ffffff';
  const cx = W / 2, cy = H * 0.45, R = Math.hypot(W, H) * 0.6;
  for (let i = 0; i < 48; i++) {
    const an = rand(0, Math.PI * 2), w = rand(0.004, 0.014), r0 = R * rand(0.45, 0.7);
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(an) * r0, cy + Math.sin(an) * r0);
    ctx.lineTo(cx + Math.cos(an - w) * R, cy + Math.sin(an - w) * R);
    ctx.lineTo(cx + Math.cos(an + w) * R, cy + Math.sin(an + w) * R);
    ctx.fill();
  }
  ctx.restore();
}
function drawBanner() {
  const b = bannerObj;
  if (!b) return;
  const t = b.max - b.life, pop = t < 0.14 ? 1.9 - t / 0.14 * 0.9 : 1 + Math.sin(t * 12) * 0.015;
  const size = bannerSize(b);
  // keep big text up in the sky so it never hides the horde
  const y = Math.max(hudH + size * 0.7, H * 0.2);
  ctx.save(); ctx.translate(W / 2, y); ctx.rotate(-0.05); ctx.scale(pop, pop);
  ctx.globalAlpha = Math.min(1, b.life / 0.25);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  outlined(b.text, 0, 0, size, b.color, b.color === C.blood ? C.flare : C.ember);
  if (b.sub) outlined(b.sub, 0, size * 0.72, Math.max(16, size * 0.26), C.bone);
  ctx.restore();
}
function drawOverlays() {
  const hue = (performance.now() / 4) % 360;
  if (flashScreen > 0) { ctx.fillStyle = `rgba(255,230,180,${Math.min(0.75, flashScreen * 1.6)})`; ctx.fillRect(0, 0, W, H); }
  if (feverT > 0) {
    ctx.fillStyle = `hsla(${hue},100%,55%,.06)`; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = `hsla(${hue},100%,60%,.85)`; ctx.lineWidth = 8; ctx.strokeRect(4, 4, W - 8, H - 8);
  }
  if (speedLines > 0 && !reduceMotion) drawSpeedLines(speedLines);
  const v = ctx.createRadialGradient(W / 2, H * 0.55, Math.min(W, H) * 0.35, W / 2, H * 0.55, Math.max(W, H) * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(10,4,12,.5)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  if (boss && boss.state === 'walk') {
    const w = Math.min(380, W - 32), x = (W - w) / 2, y = H - 30;
    ctx.fillStyle = 'rgba(18,12,23,.75)'; ctx.fillRect(x - 3, y - 3, w + 6, 16);
    ctx.fillStyle = C.blood; ctx.fillRect(x, y, w * Math.max(0, boss.hp / boss.maxHp), 10);
    ctx.save(); ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    outlined('巨大ゾンビ', x, y - 4, 14, C.bone); ctx.restore();
  }
  if (running && combo >= 5) {
    const size = 40 + comboPulse * 12;
    ctx.save(); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    const x = Math.max(16, W * 0.03), y = H * 0.52;
    outlined(`${combo}`, x, y, size, combo >= 50 ? C.flare : C.bone, C.ember);
    outlined('COMBO', x + 2, y + 20, 15, C.bone);
    ctx.restore();
  }
  if (running && DURATION - elapsed < 3) {
    ctx.save();
    ctx.globalAlpha = 0.25 + 0.35 * ((DURATION - elapsed) % 1);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `${Math.min(W, H) * 0.28 | 0}px "Dela Gothic One", sans-serif`;
    ctx.fillStyle = C.ember; ctx.fillText(Math.ceil(DURATION - elapsed), W / 2, Math.max(hudH + Math.min(W, H) * 0.16, H * 0.2));
    ctx.restore();
  }
  drawBanner();
}

function draw() {
  ctx.save();
  if (zoom > 1.001) { ctx.translate(W / 2, H / 2); ctx.scale(zoom, zoom); ctx.translate(-W / 2, -H / 2); }
  if (shake > 0.3 && !reduceMotion) ctx.translate(rand(-0.5, 0.5) * shake, rand(-0.5, 0.5) * shake);
  if (skyCv) ctx.drawImage(skyCv, 0, 0, W, H);
  drawMoon();
  drawSkyLights();
  if (groundCv) ctx.drawImage(groundCv, 0, 0, W, H);
  drawCollapses();
  drawStreetLights();
  for (const d of decals) {
    const e = groundEllipse(d.x, d.z, d.r);
    ctx.fillStyle = d.goo ? `rgba(92,10,14,${d.life * 0.5})` : `rgba(15,8,12,${d.life * 0.35})`;
    ctx.beginPath(); ctx.ellipse(e.cx, e.cy, e.rx, e.ry, 0, 0, 7); ctx.fill();
  }
  // depth-sort everything standing in the world, far first
  const items = [];
  for (const z of zombies) if (z.state !== 'moonshot') items.push({ d: z.z, t: 0, o: z });
  for (const p of parts) items.push({ d: p.z - (PART_FRONT[p.k] || 0), t: 1, o: p });
  for (const r of rockets) items.push({ d: r.z, t: 2, o: r });
  items.push({ d: Z_WALL - 0.01, t: 3 });
  for (const c of cars) items.push({ d: c.z, t: 4, o: c });
  items.sort((a, b) => b.d - a.d);
  for (const it of items) {
    if (it.t === 0) drawZombie(it.o);
    else if (it.t === 1) drawPart(it.o);
    else if (it.t === 2) drawRocket(it.o);
    else if (it.t === 3) drawWall();
    else drawCar(it.o);
  }
  for (const z of zombies) if (z.state === 'moonshot') drawMoonshot(z);
  for (const p of sparts) if (p.k === 'chunk' || p.k === 'trail' || p.k === 'moonflash') drawSpart(p);
  const hue = (performance.now() / 4) % 360;
  for (const t of tracers) {
    const a = t.life / 0.06;
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = t.fev ? `hsla(${hue},100%,65%,${a})` : `rgba(255,214,120,${a})`;
    ctx.lineWidth = t.fev ? 4 : 2.5;
    ctx.beginPath(); ctx.moveTo(t.x1 + (t.x2 - t.x1) * 0.15, t.y1 + (t.y2 - t.y1) * 0.15); ctx.lineTo(t.x2, t.y2); ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
  }
  for (const p of sparts) if (p.k === 'impact') drawSpart(p);
  drawGun();
  for (const p of sparts) if (p.k === 'casing' || p.k === 'blast') drawSpart(p);
  drawReticle();
  layoutFloaters();
  for (const f of floaters) drawFloater(f);
  ctx.restore();
  drawOverlays();
}

// ---------- HUD ----------
let hudKey = '';
function hud() {
  if (!running && endT <= 0) return;
  const tv = Math.max(0, DURATION - elapsed);
  const key = [tv.toFixed(1), score, rocketsLeft, feverT > 0 ? 'F' : fever | 0].join('|');
  if (key === hudKey) return;
  hudKey = key;
  $('time').textContent = tv.toFixed(1);
  $('time').classList.toggle('warn', tv < 5);
  $('score').textContent = score.toLocaleString();
  $('ammo').innerHTML = Array.from({ length: MAX_ROCKETS }, (_, i) => `<i class="${feverT > 0 || i < rocketsLeft ? 'on' : ''}"></i>`).join('');
  $('feverBar').style.width = fever + '%';
  $('feverWrap').classList.toggle('on', feverT > 0);
  $('feverLabel').textContent = feverT > 0 ? 'FEVER!!' : 'FEVER';
}

// ---------- title demo: the horde shambles in and gets shot up behind the menu ----------
let demoTimer = 1, demoFire = 0, demoTarget = null;
function demoTick(dt) {
  if (running || endT > 0 || $('title').hidden) return;
  elapsed = Math.min(elapsed + dt * 0.12, DURATION * 0.47);
  spawnTimer -= dt;
  if (spawnTimer <= 0 && zombies.length < 22) { spawnWave(); spawnTimer = 1.0; }
  if (demoFire > 0) {
    demoFire -= dt;
    if (demoTarget && demoTarget.state === 'walk') { const b = bodyBox(demoTarget); aim.x = b.X; aim.y = b.top + b.k * 0.4; }
    fireCD -= dt;
    if (fireCD <= 0) { fireCD = 1 / 12; shootBullet(); }
  }
  demoTimer -= dt;
  if (demoTimer <= 0) {
    const walking = zombies.filter(z => z.state === 'walk' && z.z < 32);
    if (walking.length) {
      const z = pick(walking), b = bodyBox(z);
      aim.x = b.X; aim.y = b.top + b.k * 0.4;
      if (Math.random() < 0.5) { fireRocket(b.X, sy(Math.max(Z_WALL + 1, z.z - z.speed * 0.4)), 0); tubeRecoil = 1; }
      else { demoFire = 0.7; demoTarget = z; }
    }
    demoTimer = rand(0.9, 1.6);
  }
  for (const z of zombies) if (z.state === 'walk' && z.z < Z_WALL + 3) z.z = Z_FAR;
}

if (window.ZB_DEBUG) {
  window.__zb = () => ({
    running, elapsed, score, kills, feverT, moonBroken, bossKilled, maxCombo, moonHits, cars: cars.map(c => c.state).join(','), voices: Object.keys(voiceBufs).length, ruined: city.blocks.filter(b => b.st.ruined).length,
    bld: city.blocks.filter(b => b.z0 < city.zI0 && !b.st.ruined && b.z1 > Z_WALL + 1.5).map(b => { const z = (Math.max(b.z0, Z_WALL + 0.5) + b.z1) / 2, h = Math.min(b.h * 0.5, 6); return { x: sx(b.X, z), y: sy(z, h), id: b.id, hp: +b.st.hp.toFixed(2) }; }),
    carsPos: cars.map(c => ({ x: sx(c.x, c.z - 1.9), y: sy(c.z - 1.9, 0.7), s: c.state })),
    boss: boss && boss.state === 'walk' ? (() => { const b = bodyBox(boss); return { x: b.X, y: b.top + b.k * 0.45, hp: boss.hp }; })() : null,
    targets: zombies.filter(z => z.state === 'walk' && z.type !== 'boss').map(z => { const b = bodyBox(z); return { x: b.X, y: b.top + b.k * 0.45, z: z.z, type: z.type }; }),
  });
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const raw = Math.min(0.033, (now - last) / 1000); last = now;
  const dt = slowmo > 0 ? raw * 0.35 : raw;
  demoTick(raw);
  update(dt, raw);
  draw();
  hud();
  requestAnimationFrame(frame);
}
